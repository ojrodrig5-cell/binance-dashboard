name: Binance Tracker (24/7 en la nube)

# Se ejecuta solo (cron) cada 15 minutos, y también se puede lanzar a mano
# desde la pestaña "Actions" de GitHub con el botón "Run workflow".
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Necesario para que el workflow pueda subir (git push) los cambios al repo.
permissions:
  contents: write

jobs:
  actualizar-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr tracker de ganadoras
        run: python binance_tracker.py

      - name: Correr tracker de perdedoras
        run: python binance_tracker_perdedores.py

      - name: Subir los cambios (Excel + dashboards) al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización automática del tracker"
          file_pattern: "*.xlsx *.html"
